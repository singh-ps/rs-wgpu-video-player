[package]
name = "player-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
player-core = { path = "../player-core" }
gpui = "0.2.2"
gpui-component = "0.5"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync"] }
# Must stay in lockstep with gpui's own `image` dependency; RenderImage frames
# are `image` types.
image = "0.25.1"
smallvec = "1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
