[package]
name = "rs-wgpu-video-player"
version = "0.1.0"
edition = "2021"

[dependencies]
ffmpeg-next = { version = "=8.0.0" }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync"] }
slint = { version = "1.16.1" }
cpal = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[build-dependencies]
slint-build = "1.16.1"

